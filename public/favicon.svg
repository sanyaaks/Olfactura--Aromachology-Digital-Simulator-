<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="olfacturaBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241228"/>
      <stop offset="100%" stop-color="#0E0512"/>
    </linearGradient>

    <!-- Rose-Gold Essence Gradient -->
    <linearGradient id="dropletGrad" x1="20" y1="12" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FCE4EC"/>
      <stop offset="65%" stop-color="#E8A0B8"/>
      <stop offset="100%" stop-color="#B85D77"/>
    </linearGradient>

    <!-- Radial Scent Aura -->
    <radialGradient id="auraGlow" cx="32" cy="34" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8A0B8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#C4758A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1C0F1E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base luxury round badge -->
  <rect width="64" height="64" rx="18" fill="url(#olfacturaBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#E8A0B8" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Scent vapor aura glow -->
  <circle cx="32" cy="34" r="20" fill="url(#auraGlow)"/>

  <!-- Essence droplet silhouette (Pure functional scent accord) -->
  <path
    d="M32 14 C32 14, 18 28.5, 18 37 C18 44.73 24.27 51 32 51 C39.73 51 46 44.73 46 37 C46 28.5 32 14 32 14 Z"
    fill="url(#dropletGrad)"
  />

  <!-- Specular highlight on droplet -->
  <path
    d="M32 19 C32 19, 23 29.5, 23 36 C23 40.5 25.8 44.2 29.5 45.4 C27 43.8 25.5 40.8 25.5 37 C25.5 31.2 31 23.5 32 19 Z"
    fill="#FFFFFF"
    opacity="0.55"
  />

  <!-- Top scent spark / aromatic volatile particle -->
  <circle cx="32" cy="9.5" r="2" fill="#FFFFFF"/>
  <circle cx="32" cy="9.5" r="3.5" stroke="#E8A0B8" stroke-width="0.8" stroke-opacity="0.7"/>
</svg>
